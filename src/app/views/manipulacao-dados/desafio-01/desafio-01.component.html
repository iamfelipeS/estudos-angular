<div>
    <h2>Desafio 01 - Gerar desconto</h2>
    <div class="container-desconto"> 
        <label for="porcentagem">% desconto</label>
        <div class="container-input-btn">
            <input type="number" id="desconto" [(ngModel)]="descontoPercentual">
            <button type="button" (click)="produtoComDesconto()">Aplicar</button>
        </div>
    </div>
</div>

<div class="container-produtos">
    <div class="produto" *ngFor="let produto of arrayDesconto">
        <p id="prod-name">Nome: {{ produto.nome }}</p>
        <p>Preço: R$ {{ produto.precoOriginal | number:'1.2-2' }} - com desconto: 
            R$ {{ produto.precoComDesconto | number:'1.2-2' }}
        </p>
    </div>
</div>

<div class="container" >
  <h2>New Note</h2>
  <form [formGroup]="addNoteForm">
    <div>
      <label for="note-title">
        Title:
        <input id="note-title" formControlName="title" />
      </label>
    </div>
    <div>
      <label for="note-text">
        Text:
        <input id="note-text" formControlName="text" />
      </label>
    </div>
    <button
      type="button"
      class="button"
      type="submit"
      [disabled]="addNoteForm.invalid"
      (click)="submit()"
    >
      Add Note
    </button>
  </form>
</div>
